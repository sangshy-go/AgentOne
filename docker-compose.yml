# ============================================================
# AgentOne 全栈一键部署
# 用法: docker compose up -d --build
# 访问: http://localhost（端口可用 .env 中 WEB_PORT 覆盖）
#
# 说明:
# - 本地开发用的基础设施编排在 agentone-server/docker/docker-compose.yml，
#   本文件用于完整部署（基础设施 + 后端 + 前端）。
# - 所有端口/凭据/模型配置均可通过同目录 .env 覆盖，默认值见下。
# ============================================================

services:
  # --------------------------------------------------------
  # PostgreSQL 16 + PgVector（业务库 + 向量库）
  # --------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentone-postgres-full
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentone}
      POSTGRES_USER: ${POSTGRES_USER:-agentone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentone123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # compose 位于仓库根目录，挂载路径需指向 server 下的初始化脚本
      - ./agentone-server/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentone}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # Redis 7（会话缓存、登录失败限制）
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agentone-redis-full
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-agentone123} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-agentone123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 注：MinIO（S3 兼容对象存储）为 Phase 2+ 预留，MVP 阶段文档以原文存
  # document.raw_content、未走对象存储，故一键部署编排暂不包含。

  # --------------------------------------------------------
  # 后端 API（Spring Boot，Flyway 启动时自动建表）
  # 配置注入：Spring Boot 标准环境变量覆盖 application.yml 默认值，
  # 容器内连 postgres/redis 走 compose 服务名，无需改代码。
  # --------------------------------------------------------
  backend:
    build:
      context: ./agentone-server
    image: agentone-server:latest
    container_name: agentone-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # 数据源（注意保留 stringtype=unspecified，JSONB 绑定依赖它）
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agentone}?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agentone}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-agentone123}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-agentone123}
      # 全局默认模型（Agent 未单独指定 chatModelId 时的回退；默认值与 application.yml 一致）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-4o-mini}
      # S1: 不再提供弱默认密钥；JWT_SECRET 未设置时应用启动直接失败（fail-closed）。
      # 部署前必须在同目录 .env 中设置强随机密钥：JWT_SECRET=$(openssl rand -base64 48)
      JWT_SECRET: ${JWT_SECRET}
      # 本地开发逃生开关（禁止用于生产）
      AGENTONE_ALLOW_INSECURE_JWT: ${AGENTONE_ALLOW_INSECURE_JWT:-false}
      # 课题⑤: IM 机器人凭证加密密钥（64 位 hex，openssl rand -hex 32 生成）。
      # 未配置不影响启动，但创建/更新 IM 机器人会失败（错误码 5200）
      AGENTONE_IM_SECRET_KEY: ${AGENTONE_IM_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      # 首次启动需跑 Flyway 13 个迁移 + AgentScope 初始化，低配机器可能数分钟
      start_period: 180s

  # --------------------------------------------------------
  # 前端（Nginx 托管 + 反代 /api、/v1 到 backend，SSE 已配置）
  # --------------------------------------------------------
  frontend:
    build:
      context: ./agentone-web
    image: agentone-web:latest
    container_name: agentone-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
