<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skill 中心 · AgentOne 灵一</title>
<style>
/* ============================================================
   AgentOne Design Tokens（与真机 global.css 对齐）
   ============================================================ */
:root{
  --primary:#6366F1; --primary-hover:#4F46E5;
  --primary-light:#EEF2FF; --primary-bg:#F5F3FF;
  --primary-border:#C7D2FE;
  --grad-primary:linear-gradient(135deg,#6366F1 0%,#8B5CF6 50%,#06B6D4 100%);
  --grad-primary-2:linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%);
  --grad-text:linear-gradient(135deg,#6366F1 0%,#8B5CF6 50%,#06B6D4 100%);
  --surface:#FFFFFF; --surface-alt:#F8FAFF; --bg:#EEF2FF;
  --border:#E2E8F0; --border-light:#EEF2FF; --border-strong:#CBD5E1;
  --text:#0F172A; --text-secondary:#475569; --text-muted:#64748B; --text-placeholder:#94A3B8;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow:0 2px 8px rgba(15,23,42,.06);
  --shadow-md:0 8px 24px rgba(15,23,42,.08);
  --shadow-lg:0 16px 40px rgba(15,23,42,.10);
  --glow-primary:0 0 24px rgba(99,102,241,.25);
  --glow-primary-md:0 8px 32px rgba(99,102,241,.30);
  --green:#10B981; --green-bg:#ECFDF5; --green-border:#A7F3D0;
  --orange:#F59E0B; --orange-bg:#FFFBEB; --orange-border:#FDE68A;
  --red:#EF4444; --red-bg:#FEF2F2; --red-border:#FECACA;
  --purple:#8B5CF6; --purple-bg:#F5F3FF; --purple-border:#DDD6FE;
  --indigo:#6366F1; --indigo-bg:#EEF2FF; --indigo-border:#C7D2FE;
  --blue:#3B82F6; --blue-bg:#EFF6FF; --blue-border:#BFDBFE;
  --cyan:#06B6D4; --cyan-bg:#ECFEFF; --cyan-border:#A5F3FC;
  --radius-xs:6px; --radius-sm:8px; --radius:12px; --radius-lg:16px; --radius-xl:20px;
  --sidebar-w:260px; --header-h:64px;
  --transition:.25s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-font-smoothing:antialiased;}
body{
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);background:#F0F2F8;font-size:14px;line-height:1.6;
}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--primary);color:#fff;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--primary-border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--primary);}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

/* ============================================================
   App Shell：侧边栏 + 顶栏
   ============================================================ */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:50;
}
.sidebar-header{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border-light);}
.icon-box{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:var(--grad-primary);color:#fff;font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--glow-primary);
}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.3px;}
.brand-sub{font-size:11px;color:var(--text-muted);font-weight:500;}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 12px;}
.nav-section-label{
  font-size:11px;font-weight:700;color:var(--text-placeholder);
  letter-spacing:.5px;padding:14px 10px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 10px;border-radius:var(--radius-sm);border:none;background:transparent;
  color:var(--text-secondary);font-size:13.5px;font-weight:600;text-align:left;
  transition:var(--transition);margin-bottom:2px;
}
.nav-item:hover{background:var(--surface-alt);color:var(--text);}
.nav-item.active{
  background:var(--grad-primary-2);color:#fff;box-shadow:var(--glow-primary);
}
.nav-icon{width:18px;height:18px;flex-shrink:0;display:inline-flex;}
.nav-icon svg{width:100%;height:100%;}
.sidebar-footer{padding:14px 16px;border-top:1px solid var(--border-light);display:flex;align-items:center;gap:10px;}
.user-avatar{
  width:34px;height:34px;border-radius:50%;background:var(--grad-primary);
  color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;
}
.user-meta{flex:1;min-width:0;}
.user-name{font-size:13px;font-weight:700;line-height:1.3;}
.user-ws{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;}
.header{
  height:var(--header-h);background:rgba(255,255,255,.7);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-light);display:flex;align-items:center;
  justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:40;
}
.header-breadcrumb{font-weight:700;font-size:14px;color:var(--text-secondary);}
.header-right{display:flex;align-items:center;gap:10px;}
.header-btn{
  width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface);color:var(--text-secondary);font-size:14px;transition:var(--transition);
}
.header-btn:hover{border-color:var(--primary-border);color:var(--primary);}
.content{flex:1;padding:28px;max-width:1440px;width:100%;margin:0 auto;}

/* ============================================================
   页头
   ============================================================ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-title{
  font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.2;
  background:var(--grad-text);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.page-desc{font-size:13.5px;color:var(--text-muted);font-weight:500;margin-top:4px;}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--radius);
  font-size:13px;font-weight:700;border:1px solid transparent;transition:var(--transition);white-space:nowrap;
}
.btn-gradient{background:var(--grad-primary-2);color:#fff;box-shadow:var(--glow-primary);}
.btn-gradient:hover{box-shadow:var(--glow-primary-md);transform:translateY(-1px);}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text-secondary);}
.btn-ghost:hover{border-color:var(--primary-border);color:var(--primary);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:var(--radius-sm);}

/* ============================================================
   Tabs（广场 / 我的技能）
   ============================================================ */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:4px;width:fit-content;margin-bottom:20px;}
.tab{
  padding:8px 20px;border-radius:var(--radius-sm);border:none;background:transparent;
  font-size:13.5px;font-weight:700;color:var(--text-muted);transition:var(--transition);
  display:flex;align-items:center;gap:8px;
}
.tab:hover{color:var(--text);}
.tab.active{background:var(--grad-primary-2);color:#fff;box-shadow:var(--glow-primary);}
.tab .count{font-size:11px;padding:1px 7px;border-radius:var(--radius-full,#999);background:rgba(255,255,255,.25);}
.tab:not(.active) .count{background:var(--surface-alt);color:var(--text-muted);}

/* ============================================================
   广场：搜索 + 工种导航
   ============================================================ */
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.search-box{
  flex:1;min-width:240px;max-width:480px;position:relative;display:flex;align-items:center;
}
.search-box svg{position:absolute;left:14px;width:16px;height:16px;color:var(--text-placeholder);pointer-events:none;}
.search-input{
  width:100%;padding:11px 14px 11px 40px;border-radius:var(--radius);border:1.5px solid var(--border);
  font-size:13.5px;background:var(--surface);transition:var(--transition);outline:none;font-family:inherit;
}
.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15);}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;}
.chips::-webkit-scrollbar{height:0;}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:var(--radius-full,#999);
  border:1.5px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:700;
  color:var(--text-secondary);transition:var(--transition);white-space:nowrap;
  border-radius:9999px;
}
.chip svg{width:15px;height:15px;}
.chip:hover{border-color:var(--primary-border);color:var(--primary);}
.chip.active{background:var(--grad-primary-2);color:#fff;border-color:transparent;box-shadow:var(--glow-primary);}

/* ============================================================
   精选区
   ============================================================ */
.section-title{
  font-size:16px;font-weight:700;margin:8px 0 14px;display:flex;align-items:center;gap:10px;letter-spacing:-.2px;
}
.section-title::before{content:'';width:4px;height:18px;border-radius:2px;background:var(--grad-primary);}
.section-title .hint{font-size:12px;color:var(--text-muted);font-weight:500;margin-left:auto;}

/* ============================================================
   技能卡片
   ============================================================ */
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:30px;}
.skill-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;cursor:pointer;transition:var(--transition);position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:12px;
}
.skill-card::after{
  content:'';position:absolute;top:-40%;right:-30%;width:180px;height:180px;border-radius:50%;
  background:var(--grad-primary);opacity:.05;filter:blur(36px);transition:var(--transition);pointer-events:none;
}
.skill-card:hover{box-shadow:var(--shadow-lg),var(--glow-primary);transform:translateY(-3px);border-color:var(--primary-border);}
.skill-card:hover::after{opacity:.12;}
.skill-card-top{display:flex;align-items:flex-start;gap:12px;}
.skill-icon{
  width:46px;height:46px;border-radius:var(--radius);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.skill-icon svg{width:22px;height:22px;}
.skill-card-title{flex:1;min-width:0;}
.skill-name{font-size:15px;font-weight:800;letter-spacing:-.2px;line-height:1.3;}
.skill-author{font-size:11.5px;color:var(--text-muted);margin-top:2px;font-weight:500;}
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;
  font-size:10.5px;font-weight:700;border:1px solid transparent;white-space:nowrap;
}
.badge-official{background:var(--indigo-bg);color:var(--indigo);border-color:var(--indigo-border);}
.badge-custom{background:var(--surface-alt);color:var(--text-secondary);border-color:var(--border);}
.badge-imported{background:var(--cyan-bg);color:var(--cyan);border-color:var(--cyan-border);}
.badge-builtin{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-border);}
.badge-mcp{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-border);}
.badge-cat{background:var(--surface-alt);color:var(--text-muted);border-color:var(--border);}
.badge-script{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border);}
.skill-tagline{
  font-size:12.5px;color:var(--text-secondary);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;
}
.skill-card-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.spacer{flex:1;}
.installs{font-size:11px;color:var(--text-muted);display:inline-flex;align-items:center;gap:4px;font-weight:600;}
.installs svg{width:12px;height:12px;}

/* ============================================================
   我的技能（列表）
   ============================================================ */
.list-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.list-head,.skill-row{
  display:grid;grid-template-columns:minmax(220px,2fr) 110px 110px 90px 120px 150px;
  gap:14px;align-items:center;padding:14px 20px;
}
.list-head{
  background:var(--surface-alt);border-bottom:1px solid var(--border);
  font-size:11.5px;font-weight:700;color:var(--text-muted);letter-spacing:.3px;
}
.skill-row{border-bottom:1px solid var(--border-light);transition:var(--transition);}
.skill-row:last-child{border-bottom:none;}
.skill-row:hover{background:var(--surface-alt);}
.row-skill{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;}
.row-skill .skill-icon{width:38px;height:38px;border-radius:var(--radius-sm);}
.row-skill .skill-icon svg{width:18px;height:18px;}
.row-name{font-weight:700;font-size:13.5px;line-height:1.3;}
.row-sub{font-size:11px;color:var(--text-muted);margin-top:1px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.row-stat{font-size:12.5px;color:var(--text-secondary);font-weight:600;}
.row-stat small{display:block;font-size:10.5px;color:var(--text-muted);font-weight:500;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.icon-btn{
  width:30px;height:30px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface);color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center;
  transition:var(--transition);
}
.icon-btn svg{width:15px;height:15px;}
.icon-btn:hover{border-color:var(--primary-border);color:var(--primary);}
.icon-btn.danger:hover{border-color:var(--red-border);color:var(--red);}
/* toggle */
.toggle{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle .track{
  position:absolute;inset:0;background:var(--border-strong);border-radius:9999px;transition:var(--transition);cursor:pointer;
}
.toggle .track::after{
  content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:var(--transition);box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.toggle input:checked + .track{background:var(--grad-primary-2);}
.toggle input:checked + .track::after{transform:translateX(18px);}

/* ============================================================
   空态
   ============================================================ */
.empty{
  padding:70px 20px;text-align:center;border:1.5px dashed var(--border-strong);
  border-radius:var(--radius-lg);background:var(--surface);
}
.empty-icon{
  width:64px;height:64px;border-radius:var(--radius-lg);margin:0 auto 16px;
  background:var(--primary-light);display:flex;align-items:center;justify-content:center;
}
.empty-icon svg{width:30px;height:30px;color:var(--primary);}
.empty-title{font-weight:800;font-size:16px;margin-bottom:6px;}
.empty-desc{font-size:13px;color:var(--text-muted);margin-bottom:20px;}
.empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

/* ============================================================
   详情抽屉
   ============================================================ */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:90;
}
.overlay.show{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;background:var(--surface);
  box-shadow:-16px 0 48px rgba(15,23,42,.16);z-index:100;transform:translateX(105%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
}
.drawer.show{transform:translateX(0);}
.drawer-head{padding:24px 24px 18px;border-bottom:1px solid var(--border-light);position:relative;}
.drawer-close{
  position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;transition:var(--transition);
}
.drawer-close:hover{color:var(--text);border-color:var(--border-strong);}
.drawer-close svg{width:16px;height:16px;}
.drawer-title-row{display:flex;gap:14px;align-items:flex-start;padding-right:40px;}
.drawer-icon{width:54px;height:54px;border-radius:var(--radius);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.drawer-icon svg{width:26px;height:26px;}
.drawer-name{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.25;}
.drawer-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.drawer-body{flex:1;overflow-y:auto;padding:22px 24px;}
.drawer-section{margin-bottom:24px;}
.drawer-label{
  font-size:11px;font-weight:800;color:var(--text-muted);letter-spacing:.6px;
  text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.drawer-label::before{content:'';width:3px;height:12px;border-radius:2px;background:var(--grad-primary);}
.drawer-desc{font-size:13.5px;color:var(--text-secondary);line-height:1.7;}
/* 示例对话气泡 */
.example{
  background:var(--surface-alt);border:1px solid var(--border-light);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;
}
.example-q{
  background:var(--grad-primary-2);color:#fff;border-radius:var(--radius) var(--radius) 4px var(--radius);
}
.example .avatar-dot{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;
}
.example-q .avatar-dot{background:rgba(255,255,255,.25);}
.example-a .avatar-dot{background:var(--grad-primary);}
.example-text{font-size:12.5px;line-height:1.55;padding-top:2px;}
.example-q .example-text{color:#fff;}
.example-a{background:var(--surface);border:1px solid var(--border);}
.example-a .example-text{color:var(--text-secondary);}
/* 脚本包文件树 */
.file-tree{background:var(--surface-alt);border:1px solid var(--border-light);border-radius:var(--radius);padding:12px 14px;}
.file-node{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:var(--radius-xs);font-size:12.5px;font-family:'JetBrains Mono','Fira Code',monospace;}
.file-node:hover{background:var(--surface);}
.file-node svg{width:14px;height:14px;color:var(--text-muted);flex-shrink:0;}
.file-node .f-type{margin-left:auto;font-size:10px;color:var(--text-placeholder);font-family:inherit;}
/* 试一试面板 */
.try-panel{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.try-head{
  padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;
  font-weight:700;font-size:13px;user-select:none;
}
.try-head svg{width:16px;height:16px;color:var(--primary);}
.try-head .chev{margin-left:auto;transition:transform .25s;width:14px;height:14px;color:var(--text-muted);}
.try-panel.open .try-head .chev{transform:rotate(180deg);}
.try-body{padding:0 16px 16px;display:none;}
.try-panel.open .try-body{display:block;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;}
.field label .req{color:var(--red);}
.field input,.field select,.field textarea{
  width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  font-size:13px;font-family:inherit;outline:none;transition:var(--transition);background:var(--surface);
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12);}
.try-result{
  margin-top:12px;border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;display:none;
}
.try-result.show{display:block;animation:fadeIn .3s;}
.try-result.ok{background:var(--green-bg);border:1px solid var(--green-border);color:#047857;}
.try-result pre{white-space:pre-wrap;word-break:break-word;font-family:'JetBrains Mono',monospace;font-size:11.5px;margin-top:8px;color:var(--text);background:rgba(255,255,255,.6);padding:10px;border-radius:var(--radius-xs);max-height:200px;overflow:auto;}
.try-meta{font-size:10.5px;margin-top:6px;opacity:.7;}
.adv-debug{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;}
.adv-debug a{font-size:11.5px;color:var(--text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
.adv-debug a:hover{color:var(--primary);}
/* 抽屉底部操作栏 */
.drawer-foot{
  padding:16px 24px;border-top:1px solid var(--border-light);display:flex;gap:10px;align-items:center;
  background:var(--surface);position:relative;
}
.drawer-foot .btn{flex:1;justify-content:center;}
.agent-picker{position:relative;flex:1;}
.agent-menu{
  position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  padding:6px;display:none;z-index:10;
}
.agent-menu.show{display:block;animation:fadeIn .2s;}
.agent-opt{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
  cursor:pointer;transition:var(--transition);font-size:13px;font-weight:600;width:100%;border:none;background:transparent;text-align:left;
}
.agent-opt:hover{background:var(--primary-light);}
.agent-opt .ao-icon{width:28px;height:28px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.agent-opt small{display:block;font-size:10.5px;color:var(--text-muted);font-weight:500;}
/* meta */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.meta-item{background:var(--surface-alt);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:10px 12px;}
.meta-item .k{font-size:10.5px;color:var(--text-muted);font-weight:600;}
.meta-item .v{font-size:13px;font-weight:700;margin-top:2px;}

/* ============================================================
   Toast
   ============================================================ */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--text);color:#fff;padding:12px 20px;border-radius:var(--radius);
  font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;
  opacity:0;pointer-events:none;transition:all .3s;display:flex;align-items:center;gap:10px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast svg{width:16px;height:16px;color:var(--green);}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeIn .4s;}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:1024px){
  .sidebar{transform:translateX(-100%);transition:transform .3s;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .menu-btn{display:inline-flex !important;}
  .list-head{display:none;}
  .skill-row{grid-template-columns:1fr;gap:10px;}
  .row-actions{justify-content:flex-start;}
}
@media (min-width:1025px){.menu-btn{display:none;}}
@media (max-width:640px){
  .content{padding:16px;}
  .skill-grid{grid-template-columns:1fr;}
  .drawer{width:100vw;}
  .page-title{font-size:22px;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}
}

   ============================================================ */
function filterSkills(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return SKILLS.filter(s=>{
    const catOk = activeCat==='all' || s.cat===activeCat;
    const qOk = !q || (s.name+s.tagline+s.desc+CAT_LABEL[s.cat]).toLowerCase().includes(q);
    return catOk && qOk;
  });
}
function renderPlaza(){
  renderChips();
  const list = filterSkills();
  const featured = list.filter(s=>s.source==='official');
  const others = list.filter(s=>s.source!=='official');
  const fw = document.getElementById('featuredWrap');
  if(featured.length && !document.getElementById('searchInput').value.trim() && activeCat==='all'){
    fw.style.display='';
    document.getElementById('featuredGrid').innerHTML = featured.map(cardHTML).join('');
    document.getElementById('allTitle').textContent = '全部技能';
    document.getElementById('skillGrid').innerHTML = list.map(cardHTML).join('');
  } else {
    fw.style.display='none';
    document.getElementById('allTitle').textContent = activeCat==='all' ? '全部技能' : `${CAT_LABEL[activeCat]} · ${list.length} 个技能`;
    document.getElementById('skillGrid').innerHTML = list.map(cardHTML).join('');
  }
  document.getElementById('plazaEmpty').style.display = list.length ? 'none' : '';
  document.getElementById('allTitle').style.display = list.length ? '' : 'none';
}

              : `<div style="font-size:12.5px;color:var(--text-muted);margin-bottom:12px;">该技能无需参数，直接运行即可。</div>`}
            <button class="btn btn-gradient btn-sm" onclick="runTry()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 3l14 9-14 9V3z"/></svg> 运行
            </button>
            <div class="try-result" id="tryResult"></div>
            <div class="adv-debug">
              <a href="#" onclick="showToast('高级调试：参数预检 → 执行计划 → 真实执行（复用三步向导，演示）');return false;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9"/></svg>
                高级调试（参数预检 / 执行计划）
              </a>
            </div>
          </div>
        </div>
      </div>

      <div class="drawer-section">
        <div class="drawer-label">技能信息</div>
        <div class="meta-grid">
          <div class="meta-item"><div class="k">版本</div><div class="v">${s.version}</div></div>
          <div class="meta-item"><div class="k">更新时间</div><div class="v">${s.updatedAt}</div></div>
          <div class="meta-item"><div class="k">调用次数</div><div class="v">${s.installs?s.installs+' 次':'系统内置'}</div></div>
          <div class="meta-item"><div class="k">来源</div><div class="v">${s.author}</div></div>
        </div>
      </div>
    </div>
    <div class="drawer-foot">
      ${editable?`<button class="btn btn-ghost" style="flex:0 0 auto;" onclick="showToast('进入编辑（演示）')">编辑</button>`:''}
      <div class="agent-picker">
        <div class="agent-menu" id="agentMenu">
          ${AGENTS.map(a=>`
            <button class="agent-opt" onclick="enableToAgent('${a.name}')">
              <span class="ao-icon" style="background:${TILE[a.tile]};color:${TILE_COLOR[a.tile]};">${ICONS[a.icon]}</span>
              <span>${a.name}<small>${a.desc}</small></span>
            </button>`).join('')}
        </div>
        <button class="btn btn-gradient" style="width:100%;" onclick="toggleAgentMenu()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          ${s.enabled?'启用到 Agent':'安装并启用到 Agent'}
        </button>
      </div>
    </div>`;
  document.getElementById('overlay').classList.add('show');
  d.classList.add('show');
  d.setAttribute('aria-hidden','false');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawer').setAttribute('aria-hidden','true');
}
function toggleAgentMenu(){ document.getElementById('agentMenu').classList.toggle('show'); }
function enableToAgent(name){
  document.getElementById('agentMenu').classList.remove('show');
  if(drawerSkill) drawerSkill.enabled = true;
  showToast(`已启用到「${name}」，去对话页即可使用`);
  renderMine();
}
function runTry(){
  const s = drawerSkill; if(!s) return;
  // 简单必填校验
  for(const p of s.params){
    if(p.req){
      const el = document.getElementById('p-'+p.key);
      if(el && !el.value.trim()){
        el.focus(); el.style.borderColor='var(--red)';
        showToast(`请填写「${p.label}」`); return;
      }
    }
  }
  const box = document.getElementById('tryResult');
  box.className='try-result show'; box.style.opacity='.6';
  box.innerHTML='运行中…';
  setTimeout(()=>{
    box.style.opacity='1';
    box.classList.add('ok');
    const isContent = s.type!=='api';
    box.innerHTML = `✓ 运行成功
      <pre>${isContent
        ? `【${s.name}】已加载技能指令\n\n（内容型技能：渐进式披露，function call 后返回指令全文，供 Agent 按此执行）`
        : JSON.stringify({code:0, data:{matched:3, sample:'华创科技 · 最近跟进 2026-08-05'}, message:'success'}, null, 2)}</pre>
      <div class="try-meta">耗时 ${isContent?'2ms（无出站请求）':'186ms'} · 已写入调用审计</div>`;
  }, 550);
}

/* ============================================================
   Toast / 视图切换 / Hash 路由
   ============================================================ */
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toastText').textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
function switchView(v){
  currentView=v;
  document.getElementById('view-plaza').style.display = v==='plaza'?'':'none';
  document.getElementById('view-mine').style.display = v==='mine'?'':'none';
  document.getElementById('tab-plaza').classList.toggle('active',v==='plaza');
  document.getElementById('tab-mine').classList.toggle('active',v==='mine');
  if(v==='mine') renderMine();
  try{ history.replaceState(null,'','#'+v); }catch(e){/* file:// 协议下 history API 受限，忽略 */}
}
window.addEventListener('hashchange',()=>{
  const v=location.hash.replace('#','');
  if(v==='mine'||v==='plaza') switchView(v);
});

/* ============================================================
   初始化
   ============================================================ */
renderNav();
renderPlaza();
renderMine();
if(location.hash==='#mine') switchView('mine');
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
</script>
</body>
</html>
